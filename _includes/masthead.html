<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav class="homepage-nav" aria-label="Main navigation">
        <a class="homepage-brand" href="#about-me" target="_self">Jiajun Zhu</a>
        <button class="homepage-nav-toggle" type="button" aria-expanded="false" aria-controls="homepage-nav-links" aria-label="Open navigation menu"><span aria-hidden="true">☰</span><span>Menu</span></button>
        <ul id="homepage-nav-links" class="homepage-nav-links">
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}" target="_self">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
      </nav>
    </div>
  </div>
</div>
