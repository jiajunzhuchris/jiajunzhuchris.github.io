<div class="timeline-list">
{% for entry in include.entries %}
  <article class="timeline-row">
    <a class="affiliation-icon{% if entry.logo_class %} {{ entry.logo_class }}{% endif %}" href="{{ entry.url }}" aria-label="{{ entry.title }}"><img src="{{ entry.logo }}" alt="{{ entry.alt }}" loading="lazy" width="80" height="80"></a>
    <div class="timeline-body">
      <div class="timeline-heading"><h3><a href="{{ entry.url }}">{{ entry.title }}</a></h3><span class="timeline-date">{{ entry.dates }}</span></div>
      <p>{{ entry.role }}{% if entry.detail %}<br>{{ entry.detail }}{% endif %}</p>
      {% if entry.people %}<p class="timeline-detail">{{ entry.people }}</p>{% endif %}
      {% if entry.summary %}<p>{{ entry.summary }}</p>{% endif %}
    </div>
  </article>
{% endfor %}
</div>
